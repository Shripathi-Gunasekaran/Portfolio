<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Technical Skills - Shri Pathi G" />
  <title>Skills | Shri Pathi G</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="assets/name.png" />
</head>
<body>

  <!-- Custom Animated Cursor Elements -->
  <div class="cursor-dot" id="cursorDot"></div>
  <div class="cursor-circle" id="cursorCircle"></div>

  <!-- VFX Preloader -->
  <div id="preloader" class="vfx-preloader">
    <canvas id="preloaderCanvas" class="preloader-canvas"></canvas>
    <div class="preloader-bg-overlay"></div>

    <div class="vfx-preloader-content">
      <div class="hud-frame">
        <div class="hud-corner hud-top-left"></div>
        <div class="hud-corner hud-top-right"></div>
        <div class="hud-corner hud-bottom-left"></div>
        <div class="hud-corner hud-bottom-right"></div>

        <div class="logo-vfx-wrap">
          <img src="assets/name.png" alt="ShriPathiG Logo" class="vfx-logo-img" />
          <div class="vfx-scanline"></div>
        </div>
      </div>

      <div class="vfx-status-text">
        <span class="vfx-tag">SYSTEM.INITIALIZING //</span>
        <span id="vfxPercent" class="vfx-percent">0%</span>
      </div>

      <div class="vfx-progress-bar">
        <div id="preloaderProgress" class="vfx-progress-fill">
          <div class="vfx-spark-head"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Sticky Navbar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <img src="assets/name.png" alt="Shri Pathi Logo" onerror="this.style.display='none'; document.getElementById('logoText').style.display='block';" />
        <span id="logoText" class="hidden-fallback">Shri Pathi<span class="brand-dot">.</span></span>
      </a>

      <nav>
        <ul class="nav-menu" id="navMenu">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="skills.html" class="nav-link active">Skills</a></li>
          <li><a href="experience.html" class="nav-link">Experience</a></li>
          <li><a href="projects.html" class="nav-link">Projects</a></li>
          <li><a href="contact.html" class="nav-link">Contact</a></li>
        </ul>
      </nav>

      <button class="nav-toggle" id="navToggle" aria-label="Toggle Navigation">☰</button>
    </div>
  </header>

  <main style="padding-top: 6rem;">
    <section class="features-section section-bg-dark">
      <div class="container">
        <div class="section-header-center">
          <span class="section-tag">TECHNICAL SKILLS</span>
          <h2 class="section-heading">Core Skills & Expertise</h2>
        </div>

        <div id="categorizedSkillsGrid" class="skill-grid-layout">
          <!-- Dynamically populated from script.js & data.js -->
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-content">
        <div class="brand-logo">
          <img src="assets/name.png" alt="Shri Pathi Logo" class="footer-logo-img" />
        </div>
        <p class="footer-tagline">Building scalable, elegant digital solutions.</p>

        <div class="footer-socials">
          <a href="mailto:shrisekar3@gmail.com" class="social-circle" aria-label="Email">✉</a>
          <a href="https://github.com/Shripathi-Gunasekaran" target="_blank" rel="noopener" class="social-circle" aria-label="GitHub">GH</a>
          <a href="https://linkedin.com/in/shripathi-gunasekaran-5bb7732b1" target="_blank" rel="noopener" class="social-circle" aria-label="LinkedIn">IN</a>
        </div>

        <div class="footer-copy">
          © <span id="year">2026</span> Shri Pathi G. All rights reserved.
        </div>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
